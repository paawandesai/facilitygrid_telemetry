# docker-compose up   (or: docker compose up)
#   Only one host port is published: the web app on ${WEB_PORT:-8080}. It serves the UI
#   and forwards POST /ingest/readings to the API, so the generator and the browser
#   need nothing else. Set WEB_PORT in .env (or the shell) if 8080 is taken.
#   The API, Postgres, Redpanda and Redpanda Console stay on the compose network.
#   For the host-side tests and debugging, add the dev overlay, which publishes them:
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up

x-backend: &backend
  build: .
  image: facilitygrid-backend
  pull_policy: build
  environment:
    DATABASE_URL: postgres://telemetry:telemetry@postgres:5432/telemetry
    KAFKA_BROKERS: redpanda:9092
    STALE_AFTER_MS: ${STALE_AFTER_MS:-30000}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
      POSTGRES_DB: telemetry
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 2s
      timeout: 3s
      retries: 30

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${REDPANDA_PORT:-19092}
    volumes: [redpanda:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40

  migrate:
    <<: *backend
    command: ["node", "apps/api/dist/migrate.js"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *backend
    command: ["node", "apps/api/dist/main.js"]
    environment:
      DATABASE_URL: postgres://telemetry:telemetry@postgres:5432/telemetry
      KAFKA_BROKERS: redpanda:9092
      STALE_AFTER_MS: ${STALE_AFTER_MS:-30000}
      RUN_MIGRATIONS: "false"
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  worker:
    <<: *backend
    command: ["node", "apps/worker/dist/main.js"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: facilitygrid-web
    pull_policy: build
    ports: ["${WEB_PORT:-8080}:80"]
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }

  # The provided gateway simulator. Not started by `up`; run it with
  #   docker compose run --rm generator --scenario trace --seed paawandesai
  generator:
    image: python:3.12-slim
    profiles: ["tools"]
    working_dir: /gen
    volumes: ["./telemetry_generator.py:/gen/telemetry_generator.py:ro"]
    entrypoint: ["python3", "-u", "/gen/telemetry_generator.py", "--target", "http://api:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redpanda:
