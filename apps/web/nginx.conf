server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Server-Sent Events: stream, don't buffer.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
  }
}
